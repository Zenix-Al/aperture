<div class="modal-content">
  <div class="settings-shell">
    <aside class="settings-sidebar" aria-label="Settings sections">
      <div class="settings-sidebar-title">Settings</div>
      <nav id="settings-nav" class="settings-nav">
        <div class="settings-nav-group" id="settings-nav-core"></div>

        <div
          id="settings-nav-pinned-group"
          class="settings-nav-group settings-nav-pinned-group"
          hidden
        >
          <div class="settings-nav-group-label">Pinned Add-ons</div>
          <div id="settings-nav-pinned-items" class="settings-nav-pinned-items"></div>
        </div>
      </nav>
      <div class="settings-sidebar-footer">
        <div class="settings-framework-version"></div>
        <button id="close-modal" class="modal-btn settings-close-btn">Close</button>
      </div>
    </aside>

    <section class="settings-main" aria-live="polite">
      <div class="settings-mobile-panel-header" hidden>
        <button
          type="button"
          id="settings-mobile-back"
          class="settings-mobile-nav-btn"
          aria-label="Back to menu"
        >
          < Back
        </button>
        <div id="settings-mobile-title" class="settings-mobile-panel-title">Settings</div>
        <button
          type="button"
          id="settings-mobile-close"
          class="settings-mobile-nav-btn"
          aria-label="Close settings"
        >
          Close
        </button>
      </div>


      <div id="settings-panel-addins" class="settings-panel">
        <div class="settings-wrapper-inner">
          <div class="config-header">Add-ons</div>
          <div id="addins-catalog-note" class="tag-priority-note">
            Trusted add-ons are listed here with install links and page-aware runtime status.
          </div>

          <div class="addins-panel-section">
            <div class="addins-panel-header-row">
              <div>
                <div class="addins-panel-title">Installed Add-ins</div>
                <div class="addins-panel-subtitle">
                  Status can be idle on pages where an add-in is not expected to run.
                </div>
              </div>
            </div>
            <div id="addins-installed-list" class="addins-list"></div>
          </div>
        </div>
      </div>
    </section>
  </div>

</div>
